services:
  mongodb:
    image: mongo:7
    container_name: rajaonam-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rajaonam-backend
    restart: unless-stopped
    depends_on:
      - mongodb
    environment:
      MONGO_URL: mongodb://mongodb:27017
      DB_NAME: rajaonam
      CORS_ORIGINS: http://localhost:3000
    env_file:
      - path: ./backend/.env.docker
        required: false
    ports:
      - "8001:8001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Frontend calls the backend through the nginx /api proxy on the same origin.
        # Change to http://localhost:8001 if you prefer direct backend access.
        REACT_APP_BACKEND_URL: http://localhost:3000
    container_name: rajaonam-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  mongo_data:
